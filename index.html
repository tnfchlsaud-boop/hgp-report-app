<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>HGP 동충주 보고</title>
  <style>
    :root{--blue:#0f4c81;--blue2:#e9f2fa;--green:#2f7d32;--green2:#eaf5ea;--yellow:#fff5cc;--line:#d9e2ec;--bg:#f5f7fa;--text:#1f2937;--muted:#667085;--danger:#b42318}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
    header h1{font-size:20px;margin:0 0 8px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tab{border:0;border-radius:10px;padding:9px 6px;font-weight:700;background:#edf1f5;color:#475467}.tab.active{background:var(--blue);color:#fff}
    main{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:760px;margin:auto}.page{display:none}.page.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px rgba(16,24,40,.04)}
    .card h2{font-size:17px;margin:0 0 12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;font-size:16px;border:1px solid #cfd8e3;border-radius:10px;padding:11px;background:white;color:var(--text)}input:focus,select:focus,textarea:focus{outline:2px solid #a8cdec;border-color:var(--blue)}
    .line-row{display:grid;grid-template-columns:48px 88px 1fr 1fr 1fr;gap:7px;align-items:center;margin:8px 0}.line-row.att{grid-template-columns:48px 1fr}.line-num{font-weight:800;text-align:center;background:#eef3f8;border-radius:9px;padding:11px 4px}.small{font-size:13px}.section-title{font-weight:800;color:var(--blue);margin:4px 0 10px}.person-row{display:grid;grid-template-columns:1fr 38px;gap:7px;margin:7px 0}.person-row button{border:0;border-radius:10px;background:#fee4e2;color:var(--danger);font-size:18px}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:800;background:var(--blue);color:white}.btn.secondary{background:#edf2f7;color:#344054}.btn.green{background:var(--green)}.btn.danger{background:#fef3f2;color:var(--danger)}
    pre{white-space:pre-wrap;word-break:keep-all;background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:13px;font-family:inherit;font-size:15px;line-height:1.55;margin:0}.hint{font-size:12px;color:var(--muted);line-height:1.5}.status{font-size:13px;color:var(--green);min-height:20px;margin-top:7px;font-weight:700}
    .record{border-top:1px solid var(--line);padding:11px 0}.record:first-child{border-top:0}.record-title{font-weight:800}.record-meta{font-size:12px;color:var(--muted);margin:3px 0 7px}.pill{display:inline-block;background:var(--blue2);color:var(--blue);font-weight:700;border-radius:999px;padding:3px 8px;font-size:11px;margin-right:4px}
    footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:9}.footer-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(max-width:560px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid2 .field{min-width:0}.grid2 input,.grid2 select{min-width:0;width:100%;font-size:15px;padding:10px 7px}.line-row{grid-template-columns:42px 74px 1fr 1fr 1fr;gap:5px}.line-row input,.line-row select{font-size:14px;padding:10px 6px}.grid2{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<header><h1>HGP 동충주 보고</h1><div class="tabs"><button class="tab active" data-page="operation">가동현황</button><button class="tab" data-page="attendance">출근·잔업</button></div></header>
<main>
  <section id="operation" class="page active">
    <div class="card"><h2>공통 정보</h2><div class="grid2"><div class="field"><label>날짜</label><input id="opDate" type="date"></div><div class="field"><label>근무</label><select id="opShift"><option>주간</option><option>야간</option></select></div></div><div class="grid2" style="margin-top:10px"><div class="field"><label>잔업</label><select id="opOvertime"><option>없음</option><option>있음</option></select></div><div class="field"><label>특이사항</label><input id="opNote" value="없음" placeholder="없음"></div></div></div>
    <div class="card"><h2>라인별 가동현황</h2><div class="hint">구분은 CV / HR / 미가동 중 선택하고, 가동 라인만 수량을 입력하세요.</div><div id="opLines"></div></div>
    <div class="card"><h2>가동현황 보고문</h2><pre id="opPreview"></pre><div class="btn-row" style="margin-top:10px"><button class="btn" onclick="copyText('opPreview','가동현황')">텍스트 복사</button><button class="btn secondary" onclick="shareText('opPreview')">공유</button></div><div id="opStatus" class="status"></div></div>
    <div class="card"><h2>BMA 생산실적</h2><div class="hint">금일 수량은 위 라인별 생산수량에서 CV/HR별로 자동 합산됩니다. 전일 수량만 입력하세요.</div><div class="grid2" style="margin-top:10px"><div class="field"><label>전일 CV</label><input id="prevCV" inputmode="numeric" type="number" min="0" value="0"></div><div class="field"><label>전일 HR</label><input id="prevHR" inputmode="numeric" type="number" min="0" value="0"></div></div></div>
    <div class="card"><h2>생산실적 보고문</h2><pre id="prodPreview"></pre><div class="btn-row" style="margin-top:10px"><button class="btn" onclick="copyText('prodPreview','생산실적')">텍스트 복사</button><button class="btn secondary" onclick="shareText('prodPreview')">공유</button></div></div>
  </section>

  <section id="attendance" class="page">
    <div class="card"><h2>공통 정보</h2><div class="grid2"><div class="field"><label>날짜</label><input id="attDate" type="date"></div><div class="field"><label>근무</label><select id="attShift"><option>주간</option><option selected>야간</option></select></div></div></div>
    <div class="card"><h2>출근보고 입력</h2><div class="section-title">라인</div><div id="attLines"></div><div class="section-title" style="margin-top:14px">출근 인원</div><div id="attPeople"></div><button class="btn secondary" onclick="addPerson('att')">+ 인원 추가</button></div>
    <div class="card"><h2>잔업보고 입력</h2><div class="section-title">라인</div><div id="otLines"></div><div class="section-title" style="margin-top:14px">잔업 인원</div><div id="otPeople"></div><button class="btn secondary" onclick="addPerson('ot')">+ 인원 추가</button></div>
    <div class="card"><h2>출근보고</h2><pre id="attPreview"></pre><div class="btn-row" style="margin-top:10px"><button class="btn" onclick="copyText('attPreview','출근보고')">텍스트 복사</button><button class="btn secondary" onclick="shareText('attPreview')">공유</button></div></div>
    <div class="card"><h2>잔업보고</h2><pre id="otPreview"></pre><div class="btn-row" style="margin-top:10px"><button class="btn" onclick="copyText('otPreview','잔업보고')">텍스트 복사</button><button class="btn secondary" onclick="shareText('otPreview')">공유</button></div><div id="attStatus" class="status"></div></div>
  </section>


</main>
<footer><div class="footer-inner" style="grid-template-columns:1fr"><button class="btn secondary" onclick="copyAll()">현재 탭 전체 보고 복사</button></div></footer>
<script>
const qs=id=>document.getElementById(id);
const today=new Date(); const iso=today.toISOString().slice(0,10); qs('opDate').value=iso; qs('attDate').value=iso;
const opLines=qs('opLines');
for(let i=1;i<=4;i++){opLines.insertAdjacentHTML('beforeend',`<div class="line-row"><div class="line-num">${i}</div><select id="opType${i}"><option>미가동</option><option>CV</option><option>HR</option></select><input id="opQty${i}" inputmode="numeric" type="number" min="0" value="0" placeholder="생산수량"><input id="opSense${i}" inputmode="numeric" type="number" min="0" value="0" placeholder="센싱 NG"><input id="opLead${i}" inputmode="numeric" type="number" min="0" value="0" placeholder="리드 NG"></div>`)}
const lineOptions='<option>미가동</option><option>CV</option><option>HR</option><option>타사셀</option>';
for(const [id,prefix] of [['attLines','att'],['otLines','ot']]){for(let i=1;i<=4;i++)qs(id).insertAdjacentHTML('beforeend',`<div class="line-row att"><div class="line-num">${i}</div><select id="${prefix}Type${i}">${lineOptions}</select></div>`)}
['att','ot'].forEach(p=>{for(let i=0;i<4;i++)addPerson(p,false)});
function addPerson(prefix,focus=true){const box=qs(prefix+'People'); const n=box.children.length+1; box.insertAdjacentHTML('beforeend',`<div class="person-row"><input class="${prefix}Person" placeholder="이름 ${n}"><button onclick="this.parentElement.remove(); updateAll()">×</button></div>`); if(focus)box.lastElementChild.querySelector('input').focus(); updateAll()}
function fmtDate(v){if(!v)return ''; const [y,m,d]=v.split('-'); return `${m}월 ${d}일`}
function num(id){return Number(qs(id).value||0).toLocaleString('ko-KR')}
function operationText(){let out=`HGP 동충주\n${fmtDate(qs('opDate').value)}\nCV PE E603B SKOJ\nHR PE E603D SKOJ\n\n${qs('opShift').value==='주간'?'주간 가동현황':'가동현황'}\n`;
  const blocks=[]; for(let i=1;i<=4;i++){const t=qs('opType'+i).value;if(t==='CV'||t==='HR'){blocks.push(`${t} PE ${i}\nBMA 생산수량 ${num('opQty'+i)}개\n센싱블럭조립 NG ${num('opSense'+i)}개\n리드밴딩 NG ${num('opLead'+i)}개`)}}
  if(blocks.length)out+='\n'+blocks.join('\n\n')+'\n'; out+=`\n특이사항: ${qs('opNote').value.trim()||'없음'}`; return out}
function rawNum(id){return Number(qs(id).value||0)}
function md(v){if(!v)return '';const d=new Date(v+'T00:00:00');return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
function nextDateLabel(v){if(!v)return '';const d=new Date(v+'T00:00:00');d.setDate(d.getDate()+1);return `${String(d.getMonth()+1).padStart(2,'0')}월 ${String(d.getDate()).padStart(2,'0')}일`}
function prevDateMD(v){if(!v)return '';const d=new Date(v+'T00:00:00');d.setDate(d.getDate()-1);return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
function productionText(){
  const date=qs('opDate').value; let cv=0,hr=0;
  for(let i=1;i<=4;i++){const t=qs('opType'+i).value,q=rawNum('opQty'+i);if(t==='CV')cv+=q;else if(t==='HR')hr+=q}
  return `HGP 동충주\n${fmtDate(date)} BMA 생산실적\n${nextDateLabel(date)} 05시 00분 기준\n\n전일(${prevDateMD(date)})\n37512-GI900(CV PE):\n${rawNum('prevCV').toLocaleString('ko-KR')}개\n37412-CN600(HR PE):\n${rawNum('prevHR').toLocaleString('ko-KR')}개\n\n금일(${md(date)})\n37512-GI900(CV PE):\n${cv.toLocaleString('ko-KR')}개\n37412-CN600(HR PE):\n${hr.toLocaleString('ko-KR')}개\n\n특이사항: ${qs('opNote').value.trim()||'없음'}`
}
function linesSummary(prefix){let cv=[],hr=[],third=[];for(let i=1;i<=4;i++){let t=qs(prefix+'Type'+i).value;if(t==='CV')cv.push(i); else if(t==='HR')hr.push(i); else if(t==='타사셀')third.push(i)}return {cv,hr,third}}
function people(prefix){return [...document.querySelectorAll('.'+prefix+'Person')].map(x=>x.value.trim()).filter(Boolean)}
function attText(kind){const prefix=kind==='att'?'att':'ot';const s=linesSummary(prefix);const p=people(prefix);let out=`HGP 동충주\n${fmtDate(qs('attDate').value)} ${qs('attShift').value}\nCV PE E603B SKOJ\nHR PE E603D SKOJ\n${kind==='att'?'금일 가동계획':'금일 잔업'}\n`;
  const hasMain=s.cv.length||s.hr.length;
  if(hasMain){if(s.cv.length)out+=`CV PE ${s.cv.join(',')}\n`;if(s.hr.length)out+=`HR PE ${s.hr.join(',')}\n`;out+='라인 가동입니다.'}
  else if(kind==='ot'){out+='청소잔업입니다.'}
  else if(s.third.length){out+=`타사셀 ${s.third.join(',')}\n라인 가동입니다.`}
  else{out+='라인 가동입니다.'}
  out+=`\n\n${kind==='att'?'출근 인원':'잔업인원'}\n${p.length?p.join(','):'-'}\n${p.length}명 입니다.`; return out}
function updateAll(){qs('opPreview').textContent=operationText(); qs('prodPreview').textContent=productionText(); qs('attPreview').textContent=attText('att'); qs('otPreview').textContent=attText('ot')}
document.addEventListener('input',updateAll);document.addEventListener('change',updateAll);updateAll();
async function copyText(id,label){try{await navigator.clipboard.writeText(qs(id).textContent); const s=id==='opPreview'?qs('opStatus'):qs('attStatus'); s.textContent=`${label}가 순수 텍스트로 복사되었습니다.`;setTimeout(()=>s.textContent='',1800)}catch(e){alert('복사에 실패했습니다. Safari에서 HTTPS로 열었는지 확인하세요.')}}
async function shareText(id){const text=qs(id).textContent;if(navigator.share){try{await navigator.share({text})}catch(e){}}else{await navigator.clipboard.writeText(text);alert('공유 기능을 사용할 수 없어 클립보드에 복사했습니다.')}}
async function copyAll(){const page=document.querySelector('.page.active').id;let t=page==='operation'?operationText()+'\n\n──────────\n\n'+productionText():attText('att')+'\n\n──────────\n\n'+attText('ot');try{await navigator.clipboard.writeText(t);alert('현재 탭의 보고문을 텍스트로 복사했습니다.')}catch(e){alert('복사에 실패했습니다.')}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');qs(b.dataset.page).classList.add('active')}));
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
